[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-finance-wechat-assistant"
version = "0.1.0"
description = "Personal AI finance news assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "httpx>=0.27,<1.0",
  "alembic>=1.14,<2.0",
  "holidays>=0.60,<1.0",
  "baostock>=0.8.9,<1.0",
  "jinja2>=3.1,<4.0",
  "aiofiles>=24.1,<25.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "aiosqlite>=0.20,<1.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires external PostgreSQL services"]
